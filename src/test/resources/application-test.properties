# The "test" profile inherits DB/Redis/JWT config from the always-loaded
# application.properties (env vars). This file only neutralizes the reservation
# sweeper's background timer so it never fires mid-test; the sweeper tests invoke
# sweepExpiredReservations() directly for deterministic behavior.
reservation.sweeper.fixed-delay-ms=3600000
reservation.sweeper.initial-delay-ms=3600000
